services:
  atlas:
    image: atlas-studio:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: atlas-studio
    restart: unless-stopped
    init: true
    cpus: 4
    mem_limit: 20g
    memswap_limit: 24g
    shm_size: 4g
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4310:3000"
    networks:
      n8n-network:
        aliases:
          - portal-panel
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ATLAS_RENDER_CONCURRENCY: 4
      TMPDIR: /app/.temp
    volumes:
      - /srv/robo/portal-bot/data/atlas-storage/data:/app/data
      - ../Musicas:/app/Musicas:ro
      - /srv/robo/portal-bot/data/atlas-storage/temp:/app/.temp
      - /srv/robo/portal-bot/data/atlas-storage/tmp:/tmp
      - /srv/robo/portal-bot/data/atlas-storage/auto:/app/renderer/public/auto
      - ../renderer/public/audio:/app/renderer/public/audio
      - /srv/robo/portal-bot/data/atlas-storage/generated:/app/renderer/src/generated
      - ../renderer/.models:/app/renderer/.models
      - ../lib:/app/lib:ro
      - ../public:/app/public:ro
      - ../scripts:/app/scripts:ro
      - ../server.mjs:/app/server.mjs:ro
      - /srv/robo/portal-bot/secrets/panel:/srv/robo/portal-bot/secrets/panel:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/me').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  n8n-network:
    external: true
